version: '3.8'

services:
  db:
    image: postgres:14
    container_name: nic_db
    environment:
      POSTGRES_DB: NIC_Internet_Shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_password123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: nic_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/NIC_Internet_Shop
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: test_password123
    depends_on:
      - db
    restart: on-failure

volumes:
  pg_data:
